<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project design review</title>
<link rel="stylesheet" href="review-feedback.css"><link rel="stylesheet" href="review-issues.css"><link rel="stylesheet" href="review-preview.css"><link rel="stylesheet" href="review-requirements.css"><link rel="stylesheet" href="review-revisions.css"><link rel="stylesheet" href="review-views.css"><link rel="stylesheet" href="review-workspace.css"><link rel="stylesheet" href="review-jobs.css"></head>
<body><header class="project-header"><div class="project-identity"><span class="project-symbol" aria-hidden="true">▥</span><div><h1 id="project"></h1><p>Project design review</p></div></div><nav id="products" aria-label="Products in this project"></nav><div class="project-actions"><button type="button" id="show-jobs" aria-controls="review-jobs">Jobs <span class="job-count" data-job-count>0</span></button><button type="button" id="share-review">Share review</button><button type="button" id="toggle-drawer" aria-controls="review-drawer" aria-expanded="false">Tools & discussions</button></div></header>
<div class="layout"><nav class="page-sidebar" aria-label="Pages in selected product"><h2 id="product-heading">Pages</h2><div id="pages"></div><p class="sidebar-help">One project. Its products, pages and preserved design revisions.</p></nav><main id="content" tabindex="-1"></main><aside id="review-drawer" aria-label="Review tools and discussions"><header class="drawer-header"><h2>Review workspace</h2><button type="button" id="close-drawer" aria-label="Close review drawer">×</button></header><div class="drawer-tabs"><button type="button" data-drawer-tab="tools" aria-pressed="true">Tools & notes</button><button type="button" data-drawer-tab="discussion" aria-pressed="false">Discussion</button><button type="button" data-drawer-tab="jobs" aria-pressed="false">Jobs <span class="job-count" data-job-count>0</span></button></div><div id="review-tools" class="drawer-body"></div><div id="review-discussion" class="drawer-body" hidden></div><div id="review-jobs" class="drawer-body" hidden></div><div id="review-controls" class="drawer-controls"></div></aside></div><p id="workspace-status" class="workspace-status" role="status" aria-live="polite"></p>
<script src="review-data.js"></script><script src="review-requirements.js"></script><script src="review-preview.js"></script><script src="review-issues.js"></script><script src="review-feedback.js"></script><script src="review-revisions.js"></script><script src="review-views.js"></script><script src="review-captures.js"></script><script src="review-workspace.js"></script><script src="review-jobs.js"></script><script>
const config=window.reviewConfig,esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let selected=null,selectedRevision=null,activeRevision=null,navigationSequence=0;
window.reviewWorkspace.initialize(config);window.reviewJobs.initialize();
async function show(id,revision=null,mode='push',restorePair=false){
 const sequence=++navigationSequence,base=config.pages.find(p=>p.id===id)||config.pages[0];
 if(!base)return window.reviewWorkspace.emptyProduct();
 const entry=window.reviewRevisions.resolve(base.id,revision);
 if(revision&&entry?.revision!==revision)return window.reviewWorkspace.unavailableRevision(base,revision);
 let fragment=null;try{if(entry)fragment=await window.reviewRevisions.content(entry);}catch(error){return window.reviewWorkspace.report(error.message);}
 if(sequence!==navigationSequence||!await window.reviewFeedback.flush())return;
 const page=entry?{...base,revision:entry.revision,views:entry.views,requirements:base.requirementsByRevision?.[entry.revision]||(entry.revision===base.revision?base.requirements:undefined),parts:entry.parts.map(name=>({name}))}:base;
 selected=base.id;selectedRevision=revision;activeRevision=entry;
 window.reviewWorkspace.selectProductForPage(base);window.reviewWorkspace.renderPages(base.id,page.revision);
 const url=new URL(location.href);url.hash=page.id;['left','right'].forEach(k=>{if(!restorePair)url.searchParams.delete(k)});
 if(revision)url.searchParams.set('rev',revision);else url.searchParams.delete('rev');
 if(mode==='replace')history.replaceState(null,'',url);else if(mode==='push'&&url.href!==location.href)history.pushState(null,'',url);
 document.getElementById('content').innerHTML=`<div class="page-heading"><div><p class="page-breadcrumb">${esc(window.reviewWorkspace.productLabel(base))} / ${esc(page.id)} / ${esc(page.revision)}</p><h2>${esc(page.title)}</h2><p class="page-summary">${esc(page.summary||'Review this page and its meaningful parts.')}</p></div></div><div id="capture-options"></div><div class="compare" id="compare"><figure data-comparison-side="current"><div class="source-picker"><label for="left-source">Left side</label><select id="left-source"></select><button type="button" data-full-side="current">Open full size</button></div><figcaption id="left-caption">Current</figcaption><div class="shot-wrap"><img id="current-shot" alt="Left comparison capture"></div><div class="missing-capture" hidden></div><p class="source-provenance"></p></figure><figure data-comparison-side="proposed"><div class="source-picker"><label for="right-source">Right side</label><select id="right-source"></select><button type="button" data-full-side="proposed">Open full size</button></div><figcaption id="right-caption">Suggested</figcaption><div class="shot-wrap"><img id="draft-shot" alt="Right comparison capture"></div><div class="missing-capture" hidden></div><p class="source-provenance"></p></figure></div><p id="capture-note" class="comparison-note"></p><div id="draft-caveats" class="notice">${esc(page.provenance||'Capture provenance is recorded per source.')}</div><details class="page-parts"><summary>Page parts and saved source details</summary><section class="parts">${(base.parts||[]).map(p=>`<article data-part-current="${esc(p.current||'')}" data-part-proposed="${esc(p.proposed||'')}"><strong>${esc(p.name)}</strong><p>Current: ${esc(p.current||'See preserved capture')}</p><p>Suggested: ${esc(p.proposed||'See selected proposal')}</p></article>`).join('')}</section></details>${window.reviewRequirements.render(page)}`;
 if(fragment){const saved=new DOMParser().parseFromString(fragment,'text/html'),decision=saved.getElementById('review-decision');if(decision)document.getElementById('review-decision').replaceWith(document.importNode(decision,true));}
 window.reviewRevisions.mount(page.id,entry,rev=>show(page.id,rev));
 const pair=window.reviewWorkspace.mountComparison({page,base,entry,restorePair});
 await window.reviewFeedback.mount({pageId:page.id,title:page.title,revision:page.revision,projectId:window.reviewWorkspace.project.id,productId:window.reviewWorkspace.productId(base),referenced:entry?.referenced??page.requirements?.status==='discussed',parts:(page.parts||[]).map(p=>p.name)});
 window.reviewWorkspace.dockFeedback();pair.refresh();window.reviewFeedback.decorateNav();document.getElementById('content').focus({preventScroll:true});document.getElementById('content').scrollTop=0;
}
window.reviewApp={show};
function openLocation(mode){const id=location.hash.slice(1)||window.reviewWorkspace.initialPage();return id?show(id,new URL(location.href).searchParams.get('rev'),mode,true):window.reviewWorkspace.emptyProduct();}
window.addEventListener('popstate',()=>openLocation('none'));
Promise.all([window.reviewRevisions.load(),window.reviewCaptures.load().catch(()=>{})]).then(()=>openLocation('replace')).catch(error=>window.reviewWorkspace.report(error.message));
window.reviewRevisions.watch(()=>{if(!window.reviewWorkspace.hasActivePage())return;if(!selectedRevision&&!new URL(location.href).searchParams.has('rev')&&!window.reviewFeedback.isBusy())show(selected,null,'replace');else{window.reviewRevisions.mount(selected,activeRevision,rev=>show(selected,rev));window.reviewWorkspace.report('Revision history updated. Your selected comparison is preserved; use Latest when ready.');}});
</script></body></html>
