name: Validate skill and review runtime
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/validate_package.py
      - run: python -m unittest discover -s tests -v
      - run: node --test skills/project-design-review/assets/comparator/review-revisions.test.mjs skills/project-design-review/assets/comparator/review-server.test.mjs
      - name: Check browser JavaScript syntax
        shell: bash
        run: |
          for file in skills/project-design-review/assets/comparator/*.js; do node --check "$file"; done
